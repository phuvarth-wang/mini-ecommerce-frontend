<div class="p-6"> 
  @if (product()) {
    <div class="flex items-center justify-center bg-white rounded-xl shadow-md p-6">
      <img [src]="product()?.image_url" class="w-[400px] h-[300px] object-cover rounded-lg"/>
    </div>
    <h1 class="text-3xl font-bold mt-4">
      {{ product()?.name}}
    </h1>

    <p class="mt-2 text-gray-500">
      {{ product()?.description }}
    </p>

    <div class="text-2xl font-bold mt-4">
      ฿{{ product()?.price | number }}
    </div>

    <button class="mt-4 px-4 py-2 bg-blue-600 text-white rounded">
      Add to Cart
    </button>
  } @else {
    <p class="text-center py-10">Loading . . .</p>
  } 
</div>
